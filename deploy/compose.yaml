# En la VM este archivo vive en /srv/atk; las rutas relativas parten de ahí.
# Ansible copia el código de app/ a /srv/atk/codigo.
# Prueba local (desde deploy/): CODIGO=../app HTTP_PORT=8080 docker compose up -d --build
services:
  app:
    # La imagen real de la app (app/Dockerfile)
    build: ${CODIGO:-./codigo}
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/atk.db
    volumes:
      # En la VM, ./data es /srv/atk/data: el volumen EBS montado por Ansible
      - ./data:/data
    # Sin "ports": solo Nginx puede llegar a la app, por la red interna de Compose

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      # En la VM es 80; en local se puede cambiar si el 80 está ocupado
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        # Espera al HEALTHCHECK del Dockerfile, no solo a que el contenedor exista
        condition: service_healthy
