# Reverse proxy: todo lo que llega al puerto 80 se reenvía a la app.
server {
    listen 80;
    server_name _;

    # No mostrar la versión de Nginx en errores ni cabeceras
    server_tokens off;

    # Tamaño máximo de una petición (pensado en subir planillas del histórico)
    client_max_body_size 10m;

    # DNS interno de Docker. Con proxy_pass a una variable, Nginx vuelve a
    # resolver "app" cada 10 s. Con el nombre fijo lo resolvería una sola vez
    # al arrancar, y si la app se recrea con otra IP respondería 502.
    resolver 127.0.0.11 valid=10s;
    set $app_upstream http://app:3000;

    location / {
        proxy_pass $app_upstream;

        # Para que la app sepa el host pedido y la IP real del cliente
        # (la necesitará el registro de auditoría)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
