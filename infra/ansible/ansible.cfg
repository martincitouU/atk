# Ansible lee este archivo solo si se ejecuta desde infra/ansible.
# Las rutas relativas se resuelven respecto de este archivo.
[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
# Ubuntu 24.04 trae python3; así Ansible no tiene que adivinar
interpreter_python = /usr/bin/python3
# Resultados en YAML: más fáciles de leer que JSON en una sola línea
callback_result_format = yaml

[inventory]
enable_plugins = amazon.aws.aws_ec2
