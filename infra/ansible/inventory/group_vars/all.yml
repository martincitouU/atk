# Conexión por SSM, sin SSH. El nombre del bucket no va aquí: se pasa con
# -e ansible_aws_ssm_bucket_name=... desde el output de Terraform.
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: us-east-2
# Endpoint regional explícito: con el global, las URLs firmadas de buckets
# fuera de us-east-1 pueden fallar con redirecciones.
ansible_aws_ssm_bucket_endpoint_url: https://s3.us-east-2.amazonaws.com

# Rutas en la VM
atk_root: /srv/atk
atk_data_dir: "{{ atk_root }}/data"

# Dirección pública de la app (para validar el Origin del navegador).
# public_ip_address la entrega el inventario aws_ec2: es la IP elástica.
# Cuando haya dominio y HTTPS: "https://dominio.cl".
atk_url_publica: "http://{{ public_ip_address }}"

# Usuario "node" de la imagen de la app (app/Dockerfile).
# Es el dueño de la carpeta de datos, para que el contenedor no corra como root.
atk_app_uid: 1000
atk_app_gid: 1000
