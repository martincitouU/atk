<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>ATK — comparación de los comps de la vuelta 3</title>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--fondo:#ecede6;--tinta:#1d2226;--suave:#5d666c;--linea:#d9dbd3}
*{box-sizing:border-box;margin:0}
body{font-family:Overpass,system-ui,sans-serif;background:var(--fondo);color:var(--tinta);width:2264px;padding:28px}
h1{font-size:26px;font-weight:900;letter-spacing:.02em;margin-bottom:4px}
p.sub{font-size:16px;color:var(--suave);font-weight:600;margin-bottom:22px}
.fila{display:grid;grid-template-columns:repeat(3,720px);gap:24px;margin-bottom:26px}
.fila.dos{grid-template-columns:repeat(2,720px)}
figure{background:#fff;border:1px solid var(--linea);border-radius:8px;padding:10px}
figure img{width:700px;height:auto;display:block;border:1px solid var(--linea);border-radius:4px}
figcaption{font-size:15px;font-weight:600;color:var(--suave);padding:10px 4px 2px;line-height:1.4}
figcaption b{display:block;color:var(--tinta);font-size:18px;font-weight:900}
.pt{display:inline-block;margin:0 .32em}
</style>
</head>
<body>
<h1>ATK <span class="pt">·</span> vuelta 3: profesional tipo Office, con la temática Carretera Austral</h1>
<p class="sub">Ventanilla a 1440 px con la jornada de demo. La pizarra es una tabla (una fila por divisa), los paneles llevan título y recuadro, el libro es una grilla y abajo va la barra de estado.</p>
<div class="fila">
  <figure><img src="../ventanilla-a.png" alt="Comp A"><figcaption><b>A <span class="pt">·</span> Riel y barra de comandos</b>El riel de asfalto de hoy a la izquierda y una barra de comandos de una línea arriba, con los grupos rotulados.</figcaption></figure>
  <figure><img src="../ventanilla-b.png" alt="Comp B"><figcaption><b>B <span class="pt">·</span> Pestañas de cinta (recomendado)</b>Sin riel: las secciones son pestañas con su color y su tecla, y debajo va una cinta con los comandos agrupados y rotulados.</figcaption></figure>
  <figure><img src="../ventanilla-c.png" alt="Comp C"><figcaption><b>C <span class="pt">·</span> Pizarra acoplada a la derecha</b>Un riel compacto, el registro como barra de entrada sobre el libro, y la pizarra, los saldos y el resumen en un panel lateral fijo.</figcaption></figure>
</div>
<div class="fila dos">
  <figure><img src="../ventanilla-b-oscuro.png" alt="Comp B en oscuro"><figcaption><b>B en oscuro</b>Los letreros conservan su color y los blancos reflejan; la placa se aclara.</figcaption></figure>
  <figure><img src="../cierre-b.png" alt="Cierre del día en B"><figcaption><b>Cierre del día en B</b>El letrero amarillo dice qué falta para cerrar; el conteo y los movimientos son grillas, y el conteo por billete va en un panel.</figcaption></figure>
</div>
</body>
</html>
